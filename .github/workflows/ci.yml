name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned to the exact clang-format/clang-tidy version that formats this tree
  # locally (23.1.1). apt.llvm.org's toolchain-23 repo only carries newer
  # 23.1.2 snapshots, whose clang-format already rejects config keys this tree
  # uses (AlignCaseArrows was removed upstream), so the format job installs
  # the version-exact pip wheels (published for manylinux + win_amd64) and the
  # tidy job uses the version-exact GitHub release archives (no pip wheel
  # exists for clang-tidy 23).
  LLVM_VERSION: "23.1.1"

jobs:
  build-test:
    name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows + MSVC
          - os: windows-latest
            compiler: msvc
            config: Debug
          - os: windows-latest
            compiler: msvc
            config: Release
          # Linux + GCC
          - os: ubuntu-latest
            compiler: gcc
            config: Debug
          - os: ubuntu-latest
            compiler: gcc
            config: Release
          # Linux + Clang
          - os: ubuntu-latest
            compiler: clang
            config: Debug
          - os: ubuntu-latest
            compiler: clang
            config: Release

    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: MSVC dev shell (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Clang (Linux)
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'thirdparty/vcpkg') }}

      - name: Select preset
        id: preset
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            configure="MSVC-2022-x64-Ninja"
          else
            if [ "${{ matrix.compiler }}" = "clang" ]; then
              configure="Clang-linux-x64-Ninja"
            else
              configure="GCC-linux-x64-Ninja"
            fi
          fi
          # Build/test presets are named after the configure preset minus the
          # "-Ninja" suffix: MSVC-2022-x64-Debug, GCC-linux-x64-Test, ...
          echo "name=$configure" >> "$GITHUB_OUTPUT"
          echo "base=$(basename "$configure" -Ninja)" >> "$GITHUB_OUTPUT"

      - name: Configure
        shell: bash
        run: >
          cmake --preset "${{ steps.preset.outputs.name }}"
          -Dba7lya.rk4_BUILD_TEST=ON
          -Dba7lya.rk4_BUILD_BENCHMARK=ON
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg_cache,readwrite"

      - name: Build
        shell: bash
        run: cmake --build --preset "${{ steps.preset.outputs.base }}-${{ matrix.config }}"

      - name: Test
        shell: bash
        run: ctest --preset "${{ steps.preset.outputs.base }}-Test" -C "${{ matrix.config }}" --output-on-failure

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v7
        with:
          name: compile-commands-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.config }}
          path: build/compile_commands.json

  clang-format:
    name: clang-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned clang-format
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install clang-format wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "$HOME/cfenv"
          "$HOME/cfenv/bin/pip" install -q "clang-format==${LLVM_VERSION}"
          echo "$HOME/cfenv/bin" >> "$GITHUB_PATH"

      - name: Install clang-format wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv "$HOME/cfenv"
          "$HOME/cfenv/Scripts/pip" install -q "clang-format==${LLVM_VERSION}"
          echo "$HOME/cfenv/Scripts" >> "$GITHUB_PATH"

      - name: Check formatting
        shell: bash
        run: |
          clang-format --version
          files=$(git ls-files 'include/*.hxx' 'examples/*.cxx' 'tests/*.cxx' 'benchmark/*.cxx')
          [ -n "$files" ] || { echo "no files to check" >&2; exit 1; }
          clang-format --dry-run -Werror --style=file $files

  clang-tidy:
    name: clang-tidy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Cache clang-tidy archive
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-cache
          key: llvm-${{ env.LLVM_VERSION }}-${{ runner.os }}

      - name: Install pinned clang-tidy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          asset="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${asset}"
          mkdir -p "$RUNNER_TEMP/llvm-cache" "$HOME/tidyenv"
          [ -f "$RUNNER_TEMP/llvm-cache/$asset" ] || curl -sSL --retry 3 -o "$RUNNER_TEMP/llvm-cache/$asset" "$url"
          # The binary needs libLLVM/libclang-cpp (.so) and clang's resource
          # headers (lib/clang/<ver>/include/stddef.h) to compile anything.
          tar -xf "$RUNNER_TEMP/llvm-cache/$asset" -C "$HOME/tidyenv" --strip-components=1 \
            --wildcards-match-slash --wildcards '*/bin/clang-tidy' '*/lib/*.so*' '*/lib/clang/*/include/*'
          echo "$HOME/tidyenv/bin" >> "$GITHUB_PATH"

      - name: Install pinned clang-tidy (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/clang%2Bllvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-cache" "$HOME/tidyenv"
          [ -f "$RUNNER_TEMP/llvm-cache/$asset" ] || curl -sSL --retry 3 -o "$RUNNER_TEMP/llvm-cache/$asset" "$url"
          # bsdtar wildcards match '/' and prefixes directories implicitly;
          # bin/ carries the exe + its DLLs, lib/clang/<ver>/include the resource headers.
          /c/Windows/System32/tar.exe -xf "$RUNNER_TEMP/llvm-cache/$asset" -C "$HOME/tidyenv" \
            --strip-components=1 "*/bin/*"
          /c/Windows/System32/tar.exe -xf "$RUNNER_TEMP/llvm-cache/$asset" -C "$HOME/tidyenv" \
            --strip-components=1 "*/lib/clang/*/include/*"
          echo "$HOME/tidyenv/bin" >> "$GITHUB_PATH"

      - name: Lint public headers
        shell: bash
        run: |
          clang-tidy --version
          clang-tidy --quiet $(git ls-files 'include/*.hxx') -- -std=c++23
